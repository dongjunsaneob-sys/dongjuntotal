<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="shortcut icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<title>원스톱 철거 인테리어 — 방문 경로 설문조사</title>
<meta name="description" content="원스톱 철거·인테리어 방문 경로 설문조사 페이지입니다.">
<link rel="canonical" href="https://www.dongjuntotal.com/survey">
<meta property="og:type" content="website">
<meta property="og:site_name" content="원스톱 철거 인테리어">
<meta property="og:title" content="원스톱 철거 인테리어 — 방문 경로 설문조사">
<meta property="og:image" content="https://www.dongjuntotal.com/logo.jpg">
<meta property="og:url" content="https://www.dongjuntotal.com/survey">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.dongjuntotal.com/logo.jpg">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-main: #F8FAFC;
    --text-sub: #94A3B8;
    --accent: #2563EB;
    --accent-hover: #3B82F6;
    --accent-light: rgba(37, 99, 235, 0.15);
    --radius: 20px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(217, 119, 6, 0.12) 0%, transparent 40%);
    overflow-x: hidden;
  }

  .survey-container {
    width: 100%;
    max-width: 640px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 40px 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    animation: fadeInScale 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .brand-logo {
    height: 42px;
    width: auto;
    border-radius: 8px;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }

  .survey-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.2);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #60A5FA;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .survey-title {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.3;
    margin-bottom: 12px;
    text-align: center;
  }

  .survey-desc {
    font-size: 15px;
    color: var(--text-sub);
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .option-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    color: inherit;
  }

  .option-card:hover {
    background: rgba(37, 99, 235, 0.2);
    border-color: #3B82F6;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
  }

  .option-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .option-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 22px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .option-label {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .option-subtext {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 2px;
  }

  .option-arrow {
    width: 24px;
    height: 24px;
    color: var(--text-sub);
    transition: transform 0.2s, color 0.2s;
  }

  .option-card:hover .option-arrow {
    transform: translateX(4px);
    color: #60A5FA;
  }

  .skip-container {
    margin-top: 28px;
    text-align: center;
  }

  .skip-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.2s;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .skip-btn:hover {
    color: var(--text-main);
  }

  /* Success Toast Overlay */
  .toast-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .toast-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .toast-box {
    background: #1E293B;
    border: 1px solid #3B82F6;
    padding: 32px 48px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .toast-overlay.active .toast-box {
    transform: scale(1);
  }

  .toast-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .toast-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #FFFFFF;
  }

  .toast-desc {
    font-size: 14px;
    color: #94A3B8;
  }
</style>
<link rel="stylesheet" href="typography.css">
</head>
<body>

<div class="survey-container">
  <div class="brand-header">
    <img src="logo.jpg" alt="원스톱 로고" class="brand-logo">
    <span class="brand-name">원스톱 철거 · 인테리어 · 바닥철거</span>
  </div>

  <div style="text-align: center;">
    <span class="survey-badge">Quick Survey 1/1</span>
    <h1 class="survey-title">어떤 경로로 방문하셨나요?</h1>
    <p class="survey-desc">선택해 주시면 더 신속하고 정확한 맞춤 상담을 안내해 드립니다.</p>
  </div>

  <div class="options-grid">
    <div class="option-card" onclick="selectInflow('네이버 (검색/블로그)')">
      <div class="option-left">
        <div class="option-icon" style="color: #2DB400; background: rgba(45, 180, 0, 0.1);">N</div>
        <div>
          <div class="option-label">네이버</div>
          <div class="option-subtext">네이버 검색, 블로그, 지식iN, 카페</div>
        </div>
      </div>
      <svg class="option-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="option-card" onclick="selectInflow('페이스북 / 인스타그램')">
      <div class="option-left">
        <div class="option-icon" style="color: #E1306C; background: rgba(225, 48, 108, 0.1);">📸</div>
        <div>
          <div class="option-label">페이스북 / 인스타그램</div>
          <div class="option-subtext">SNS 홍보물, 피드 및 스토리 광고</div>
        </div>
      </div>
      <svg class="option-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="option-card" onclick="selectInflow('당근마켓')">
      <div class="option-left">
        <div class="option-icon" style="color: #FF6F09; background: rgba(255, 111, 9, 0.1);">🥕</div>
        <div>
          <div class="option-label">당근마켓</div>
          <div class="option-subtext">당근 동네생활 및 지역 광고</div>
        </div>
      </div>
      <svg class="option-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="option-card" onclick="selectInflow('지인 추천 / 입소문')">
      <div class="option-left">
        <div class="option-icon" style="color: #3B82F6; background: rgba(59, 130, 246, 0.1);">👥</div>
        <div>
          <div class="option-label">지인 추천 / 주변 소개</div>
          <div class="option-subtext">지인, 상가 거래처, 건축주 소개</div>
        </div>
      </div>
      <svg class="option-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="option-card" onclick="selectInflow('기타 / 직접 검색')">
      <div class="option-left">
        <div class="option-icon" style="color: #A855F7; background: rgba(168, 85, 247, 0.1);">🔍</div>
        <div>
          <div class="option-label">기타</div>
          <div class="option-subtext">기타 웹사이트, 유튜브, 현장 간판</div>
        </div>
      </div>
      <svg class="option-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>

  <div class="skip-container">
    <button class="skip-btn" onclick="skipSurvey()">건너뛰고 바로 사이트 둘러보기 →</button>
  </div>
</div>

<div id="toast" class="toast-overlay">
  <div class="toast-box">
    <div class="toast-icon">✨</div>
    <div class="toast-title">소중한 답변 감사합니다!</div>
    <div class="toast-desc">원스톱 맞춤 상담 페이지로 이동합니다...</div>
  </div>
</div>

<script>
  function getRedirectTarget() {
    const params = new URLSearchParams(window.location.search);
    return params.get('redirect') || 'index.html';
  }

  function selectInflow(option) {
    try {
      const scriptUrl = 'https://script.google.com/macros/s/AKfycbzddLHE6DZn2ANwS6ajHrGGZ-kmfUSYLR9ZQLDkFNqw_7qwBr559_U0tJEDBmp3HpKLuQ/exec';
      const params = new URLSearchParams();
      params.append('name', '[유입 설문 참여]');
      params.append('phone', '000-0000-0000');
      params.append('category', '방문자 유입 경로 설문');
      params.append('inflow', option);
      params.append('inflowChannel', option);
      params.append('message', `[유입 설문 접수] 방문자가 선택한 유입 경로: ${option}`);
      fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      }).catch(() => {});
    } catch(e) {}
    try {
      localStorage.setItem('onestop_inflow', option);
      sessionStorage.setItem('onestop_inflow_done', 'true');
    } catch(e) {}

    document.getElementById('toast').classList.add('active');
    
    setTimeout(() => {
      window.location.href = getRedirectTarget();
    }, 900);
  }

  function skipSurvey() {
    try {
      localStorage.setItem('onestop_inflow', '건너뜀');
      sessionStorage.setItem('onestop_inflow_done', 'true');
    } catch(e) {}
    window.location.href = getRedirectTarget();
  }
</script>

</body>
</html>
